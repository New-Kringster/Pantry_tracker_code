; Pantry tracker: M5Stack CoreS3 SE + Module13.2 QRCode (M145) + a battery base.
; One firmware, one chip. `pio run -t upload` builds and flashes it over USB.
; WiFi and the server address are entered on the device's setup page; for a
; development build you can also put them in include/secrets.h (copy secrets.h.example).

[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM ${sysenv.PANTRY_BUILD_FLAGS}
; Exact pins: a caret range re-resolves when .pio is deleted and silently changes the image.
lib_deps =
	m5stack/M5Unified@0.2.29
	m5stack/M5GFX@0.2.36
	bblanchon/ArduinoJson@7.4.3
